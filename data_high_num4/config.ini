# ======================================================================
#  config.ini  -  every setting for the whole project lives here.
#  All scripts (run_sumo.py, dbscan, track.py, replay.py, benchmark.py)
#  read this file. Edit a value, save, run the next command.
#
#  Rules: one "key = value" per line, comments on their own lines only.
#  Relative paths are relative to the folder that contains this file.
# ======================================================================

[paths]
# Folder where trajectories, clusters, timings and the GIF are stored.
data_dir = data_high


# ----------------------------------------------------------------------
#  1. Traffic simulation  ->  python run_sumo.py
# ----------------------------------------------------------------------
[sumo]
# "grid" builds a grid city automatically, or give the path to your own
# SUMO network file, for example  pune.net.xml
network = grid

# Grid city only: number of blocks per side, and block length in metres.
grid_size = 25
grid_length = 200

# Number of recorded time steps (1 step = 1 second of traffic).
steps = 120

# Steps simulated first (not recorded) so the roads fill up.
warmup = 60

# Vehicles released at the very start.
initial_vehicles = 20000

# New vehicles added per step (can be a decimal, e.g. 2.5).
flow = 5.0

# Temporary blockages that create jams: how many, when the first one
# starts (steps after recording begins), the gap between them, and how
# long each lasts. Set jams = 0 for no deliberate jams.
jams = 0
jam_start = 100
jam_gap = 30
jam_duration = 40

# Random seed: same seed = same traffic every time.
seed = 1


# ----------------------------------------------------------------------
#  2. Clustering  ->  mpirun / mpiexec ... dbscan   (or python run_dbscan.py)
# ----------------------------------------------------------------------
[dbscan]
# Two vehicles are neighbours when they are closer than eps_pos metres
# AND their velocity vectors differ by less than eps_vel m/s.
eps_pos = 30
eps_vel = 4

# Neighbours (counting the vehicle itself) needed to form a cluster core.
min_pts = 3

# How the map is cut between MPI processes:
#   balanced = equal number of vehicles per process (recommended)
#   equal    = equal width per process
split = balanced

# Repeat the clustering of each step this many times and average the
# timing. Higher = steadier timings, slower run.
reps = 3

# Only process the first N steps (0 = all steps).
max_steps = 0


[mpi]
# Number of MPI processes for the parallel run (used by run_dbscan.py).
# If you start MPI by hand, give the same number to -n.
processes = 4

# auto, mpirun or mpiexec. "auto" picks whichever is installed.
launcher = auto

# Extra flags for the launcher, e.g.  --oversubscribe  (OpenMPI when
# processes is larger than your CPU core count). Leave empty if unsure.
extra_args = --use-hwthread-cpus


# ----------------------------------------------------------------------
#  3. Cluster tracking and stuck detection  ->  python track.py
# ----------------------------------------------------------------------
[tracking]
# A cluster is "stuck" when the mean speed of its vehicles stays below
# stuck_speed (m/s) for stuck_steps steps in a row.
stuck_speed = 2.0
stuck_steps = 3


# ----------------------------------------------------------------------
#  4. Side-by-side replay  ->  python replay.py
# ----------------------------------------------------------------------
[replay]
# How many seconds on screen the SEQUENTIAL run should take. The
# parallel run is shown with the same time stretch, so it finishes sooner.
seq_duration = 20

# Frames per second of the animation / GIF.
fps = 10

# Open a window with the animation (needs a GUI toolkit for matplotlib;
# if none is available a GIF is written instead).
show_window = true

# Also save the animation as a GIF in data_dir.
make_gif = true
gif_name = replay.gif


# ----------------------------------------------------------------------
#  5. Scaling benchmark  ->  python benchmark.py
# ----------------------------------------------------------------------
[benchmark]
# Process counts to compare (space separated).
processes = 1 2 4

# Timing repeats per step (higher = steadier numbers).
reps = 3

# Also compare "equal" strips against "balanced" strips.
compare_split = true